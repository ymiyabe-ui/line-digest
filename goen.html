<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>先生とのご縁</title>
<style>
  :root{
    --bg:#f6f4ef; --card:#fff; --ink:#26231f; --sub:#6b655c; --line:#e3ded3;
    --accent:#2f6f5e; --today:#c0392b; --link:#3d6b5e; --btn:#2f6f5e; --sat:#2a5db0; --sun:#c0392b; --soon:#d9822b; --week:#b59a2f; --later:#5b7c99;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#1c1b19; --card:#26251f; --ink:#eeeae0; --sub:#a39d90; --line:#3a382f; --accent:#6fbfa8;
      --today:#ef7a6c; --link:#a9c9bd; --btn:#3f8f79; --sat:#8fb4ec; --sun:#ef8a7c; --soon:#eaa155; --week:#d6bf57; --later:#8fb0cc;}
  }
  :root[data-theme="dark"]{--bg:#1c1b19; --card:#26251f; --ink:#eeeae0; --sub:#a39d90; --line:#3a382f; --accent:#6fbfa8;
    --today:#ef7a6c; --link:#a9c9bd; --btn:#3f8f79; --sat:#8fb4ec; --sun:#ef8a7c; --soon:#eaa155; --week:#d6bf57; --later:#8fb0cc;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,"Hiragino Sans","Yu Gothic UI",Meiryo,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  h1{font-size:20px;margin:4px 0 2px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .theme{flex:none;display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--card);overflow:hidden}
  .theme button{font-size:14px;line-height:1;min-width:38px;padding:7px 10px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--sub);cursor:pointer}
  .theme button:first-child{border-left:0}
  /* ライト＝クリーム地に濃い茶、ダーク＝紺地に白。表示中の色に関係なく同じ色で、形（☼／☾）でも区別できる */
  .theme button[data-m="light"]{background:#fff2c2;color:#6b4a00}
  .theme button[data-m="dark"]{background:#26324f;color:#f0f3ff}
  .theme button[aria-pressed="true"]{font-weight:700;box-shadow:inset 0 0 0 3px var(--ink)}
  .theme button[data-m="auto"][aria-pressed="true"]{background:var(--accent);color:var(--card);box-shadow:none}
  .back{display:inline-flex;align-items:center;gap:8px;margin:10px 0 6px;padding:8px 14px 8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);text-decoration:none;font-size:15px;font-weight:700}
  .back svg{flex:none;width:24px;height:24px;color:var(--accent)}
  .meta{color:var(--sub);font-size:13px}
  details{margin-top:14px}
  summary{cursor:pointer;font-weight:700;font-size:15px;padding:8px 0;border-bottom:2px solid var(--line)}
  h3{font-size:13px;margin:16px 0 6px;color:var(--sub)}
  .list{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .item{display:flex;gap:12px;align-items:baseline;padding:8px 12px;border-top:1px solid var(--line);font-size:15px}
  .item:first-child{border-top:0}
  .item .d{flex:none;min-width:7.5em;font-weight:700;font-variant-numeric:tabular-nums}
  .item .sat{color:var(--sat)}
  .item .sun{color:var(--sun)}
  .item.past{color:var(--sub);opacity:.55}
  .item.next{box-shadow:inset 4px 0 0 var(--accent)}
  .tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:1px}
  .small{font-size:13px;color:var(--sub);margin-top:4px}
  .links a{display:inline-block;margin:10px 0 4px;padding:6px 14px;border:1px solid var(--btn);border-radius:8px;background:var(--btn);color:#fff;text-decoration:none;font-size:14px}
  .rec{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
  .rec{display:flex;align-items:center;gap:10px}
  .rec .body{flex:1;min-width:0}
  .rec .t{font-weight:700}
  .rec .left{flex:none;font-size:14px;font-weight:700;color:#fff;border-radius:999px;padding:3px 12px;white-space:nowrap}
  .rec.past{opacity:.6}
  /* 高森先生座談会の見出し：右横にお布施の納め方のボタン（押しても開閉しない） */
  .zahead{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .zahead::-webkit-details-marker{display:none}
  .zahead span::before{content:"▶";display:inline-block;font-size:11px;margin-right:6px;transition:transform .15s}
  details[open] > .zahead span::before{transform:rotate(90deg)}
  .zahead{list-style:none}
  .fuse{flex:none;padding:6px 10px;border:1px solid var(--btn);border-radius:8px;background:var(--card);color:var(--link);text-decoration:none;font-size:12px;line-height:1.35;text-align:center;font-weight:700}
  .fusenote{margin:10px 0 6px;font-size:14px;color:var(--today);font-weight:700}
  .fusenote a{color:inherit}
  /* 高森先生座談会：回ごとの箱。前後半のある回は中にもう一段畳む。チェックした動画は薄くする（取り消し線は引かない） */
  .za{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:8px;padding:0 12px}
  .za > summary{border-bottom:0;padding:10px 0}
  .za[open] > summary{border-bottom:1px solid var(--line)}
  .za.single{padding:0}
  .za .tag{background:var(--sub)}
  .zv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
  .zv:first-of-type{border-top:0}
  .za.single .zv{padding:10px 12px}
  .zv input{width:22px;height:22px;flex:none;accent-color:var(--accent)}
  .zv .body{flex:1;min-width:0}
  .zv .t{font-weight:700}
  .zv a{flex:none;padding:6px 12px;border:1px solid var(--btn);border-radius:8px;background:var(--btn);color:#fff;text-decoration:none;font-size:14px;white-space:nowrap}
  .zv.done{opacity:.45}
  .za.done > summary{opacity:.45}
  .za .note{margin:4px 0 10px;border-top:1px solid var(--line)}
  .za .note summary{font-size:14px;border-bottom:0;padding:8px 0 4px}
  .za .note p{margin:6px 0;font-size:14px}
  .za .note .links a{margin-right:8px}
  .za .note .links a.ghost{background:transparent;color:var(--link)}
  footer{margin:28px 0 8px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>先生とのご縁</h1>
    <div class="theme" id="theme" role="group" aria-label="表示の切り替え"><button type="button" data-m="auto">自動</button><button type="button" data-m="light" aria-label="ライト">☼</button><button type="button" data-m="dark" aria-label="ダーク">☾</button></div>
  </div>
  <div><a class="back" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>案内まとめへ戻る</a></div>
  <div class="meta" id="meta"></div>

  <div id="pickup" hidden><h3>PICK UP</h3><div id="pickItems"></div></div>

  <details id="schWrap"><summary>二千畳ご講演等の予定（全日程）</summary><div id="schedule"></div></details>

  <details id="recWrap"><summary>先生と学徒との対話（録画聴聞）</summary>
    <div class="links"><a id="recLink" target="_blank" rel="noopener noreferrer">録画の視聴ページを開く</a></div>
    <div id="recs"></div>
  </details>
  <details id="zaWrap" hidden><summary class="zahead"><span>高森先生座談会</span><a class="fuse" href="https://www.gkt.jp/#/videos/3894" target="_blank" rel="noopener noreferrer">聞かせて頂いたお礼の<br>お布施の納め方</a></summary>
    <div class="fusenote">座談会を聞かせて頂いたお礼のお布施は、<a href="https://www.gkt.jp/#/videos/3894" target="_blank" rel="noopener noreferrer">遷移先</a>から各自で納めていただくか<a href="https://line.me/ti/p/aS7uMPmBbM" target="_blank" rel="noopener noreferrer">宮部</a>までご相談ください。</div>
    <div class="small">視聴期限はありません。見終わった動画はチェックを付けると薄くなります（この端末の中だけに保存）。</div>
    <div id="zadankai"></div>
  </details>

  <footer>作成・更新：宮部（手動で整理しています）／誤りや抜けがあれば連絡ください</footer>
</div>

<script>
(function(){
  var root=document.documentElement, btns=document.querySelectorAll("#theme button");
  var m="auto"; try{ m=localStorage.getItem("digest-theme")||"auto"; }catch(e){}
  if(["auto","light","dark"].indexOf(m)<0) m="auto";
  function apply(){
    if(m==="auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme",m);
    for(var i=0;i<btns.length;i++) btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-m")===m ? "true" : "false");
  }
  for(var i=0;i<btns.length;i++) btns[i].addEventListener("click",function(){ m=this.getAttribute("data-m"); try{localStorage.setItem("digest-theme",m);}catch(e){} apply(); });
  apply();
})();
</script>
<script src="config.js?v=202610180008"></script>
<script src="data.js?v=202610180008"></script>
<script>
// GoatCounter：config.js にサイトコードがあるときだけ、閲覧数を計測する（Cookieなし）
(function(){
  var c = window.GOATCOUNTER_CODE; if(!c) return;
  var s = document.createElement("script"); s.async = true;
  s.src = "https://gc.zgo.at/count.js";
  s.setAttribute("data-goatcounter", "https://"+c+".goatcounter.com/count");
  document.body.appendChild(s);
})();
</script>
<script>
(function(){
  var G = window.GOEN;
  if(!G){
    document.getElementById("meta").textContent = "予定を読み込めませんでした。ページを再読み込みしてください。";
    document.getElementById("schWrap").open = true;
    return;
  }
  var WD = ["日","月","火","水","木","金","土"];

  // ?today=2026-10-15 で日付を固定して確認できる
  var q = /[?&]today=(\d{4})-(\d{2})-(\d{2})/.exec(location.search);
  var now = q ? new Date(+q[1], +q[2]-1, +q[3], 9, 0) : new Date();
  var today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  function parse(s){ var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function dayDiff(s){ return Math.round((parse(s)-today0)/86400000); }
  function fmt(s){ var d=parse(s); return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"; }
  function wareki(s){ var d=parse(s); return "令和"+(d.getFullYear()-2018)+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日"; }
  function dayEl(s){ var w=parse(s).getDay(); return el("span", w===6?"sat":w===0?"sun":null, fmt(s)); }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

  document.getElementById("meta").textContent = "今日："+fmt(today0.getFullYear()+"-"+String(today0.getMonth()+1).padStart(2,"0")+"-"+String(today0.getDate()).padStart(2,"0"));

  // 二千畳ご講演等の予定：月ごとに並べ、過ぎたものは薄く、次のご縁に印を付ける
  var items = G.schedule.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; });
  var next = null;
  items.forEach(function(s){ if(!next && dayDiff(s.end||s.date) >= 0) next = s; });
  var box = document.getElementById("schedule"), list = null, cur = "";
  items.forEach(function(s){
    var d = parse(s.date), ym = "令和"+(d.getFullYear()-2018)+"年"+(d.getMonth()+1)+"月";
    if(ym !== cur){ cur = ym; box.appendChild(el("h3",null,ym)); list = el("div","list"); box.appendChild(list); }
    var past = dayDiff(s.end||s.date) < 0;
    var row = el("div","item"+(past?" past":"")+(s===next?" next":""));
    // 日付は土曜を青、日曜を赤にする（期間の行事は始まりと終わりをそれぞれ色分け）
    var dd = el("span","d");
    dd.appendChild(dayEl(s.date));
    if(s.end){ dd.appendChild(document.createTextNode("〜")); dd.appendChild(dayEl(s.end)); }
    row.appendChild(dd);
    var t = el("span","t", s.title);
    if(s===next) t.appendChild(el("span","tag", dayDiff(s.date)<=0 ? "開催中・今日" : "次のご縁"));
    row.appendChild(t);
    list.appendChild(row);
  });

  // PICK UP：直近の二千畳（対話・秋の集い以外の予定。ご講演・Q&A・新春大会・初聞法会・報恩講など）と、
  // 直近の先生と学徒との対話を1件ずつ日程付きで出す。秋の集いは関連として添える。
  // 同じ題名が連日（報恩講の土日など）なら、1件にまとめて両日を出す。
  var pickBox = document.getElementById("pickItems");
  [function(s){ return s.title!=="先生と学徒との対話" && s.title!=="秋の集い"; }, function(s){ return s.title==="先生と学徒との対話"; }].forEach(function(test, k){
    var s = items.filter(function(x){ return test(x) && dayDiff(x.end||x.date) >= 0; })[0];
    if(!s) return;
    var days = items.filter(function(x){ return x.title===s.title && x.date>=s.date && dayDiff(x.date)-dayDiff(s.date) <= 1; });
    var c = el("div","rec");
    var body = el("div","body");
    var t = el("div","t");
    days.forEach(function(x, idx){ if(idx) t.appendChild(document.createTextNode("・")); t.appendChild(dayEl(x.date)); });
    if(s.end){ t.appendChild(document.createTextNode("〜")); t.appendChild(dayEl(s.end)); }
    t.appendChild(document.createTextNode("　"+s.title));
    body.appendChild(t);
    if(k===0){
      var rel = items.filter(function(x){ return x.title==="秋の集い" && dayDiff(x.end||x.date) >= 0 && x.date<=(days[days.length-1].date) && (x.end||x.date)>=s.date; })[0];
      if(rel){ var sm = el("div","small","関連："); sm.appendChild(dayEl(rel.date)); sm.appendChild(document.createTextNode("〜")); sm.appendChild(dayEl(rel.end||rel.date)); sm.appendChild(document.createTextNode("　"+rel.title)); body.appendChild(sm); }
    }
    c.appendChild(body);
    var n = dayDiff(s.date), b = el("span","left", n<0 ? "開催中" : n===0 ? "本日" : "開始まで残り"+n+"日");
    b.style.background = n<=0 ? "var(--today)" : n<=3 ? "var(--soon)" : n<=7 ? "var(--week)" : "var(--later)";
    c.appendChild(b);
    pickBox.appendChild(c);
  });
  if(pickBox.children.length) document.getElementById("pickup").hidden = false;

  // 対話の録画：視聴期限の近い順。期限を過ぎたものは薄く
  document.getElementById("recLink").href = G.recUrl;
  var rb = document.getElementById("recs");
  G.recordings.slice().sort(function(a,b){ return a.until<b.until?-1:1; }).forEach(function(r){
    var past = dayDiff(r.until) < 0;
    var c = el("div","rec"+(past?" past":""));
    var body = el("div","body");
    body.appendChild(el("div","t","先生と学徒との対話（"+wareki(r.date)+"）"));
    body.appendChild(el("div","small", past ? "視聴期限を過ぎました（"+fmt(r.until)+" "+r.until_time+"まで）" : fmt(r.until)+" "+r.until_time+" まで視聴できます"));
    c.appendChild(body);
    // 視聴期限までの残り日数を、案内まとめの締切と同じ色分けで右側に出す
    if(!past){
      var n = dayDiff(r.until), b = el("span","left", n===0 ? "今日まで" : "あと"+n+"日");
      b.style.background = n===0 ? "var(--today)" : n<=3 ? "var(--soon)" : n<=7 ? "var(--week)" : "var(--later)";
      c.appendChild(b);
    }
    rb.appendChild(c);
  });

  // 高森先生座談会：回ごとに並べる。前後半のある回は畳み、補足（資料）はその回の中にさらに畳む
  var Z = window.ZADANKAI;
  if(Z && Z.length){
    var zst = {};
    try { zst = JSON.parse(localStorage.getItem("goen-zadankai")||"{}"); } catch(e){}
    var zbox = document.getElementById("zadankai");
    Z.forEach(function(z){
      var multi = z.videos.length > 1;
      var box = el(multi?"details":"div", "za"+(multi?"":" single"));
      var sum = null;
      if(multi){ sum = el("summary"); box.appendChild(sum); }
      var rows = [];
      z.videos.forEach(function(v){
        var row = el("div","zv");
        var cb = el("input"); cb.type="checkbox"; cb.setAttribute("aria-label","見た");
        var body = el("div","body");
        body.appendChild(el("div","t", multi ? v.part : "高森先生座談会（"+z.no+"回目）"));
        body.appendChild(el("div","small", v.length));
        var a = el("a",null,"視聴ページへ"); a.href=v.url; a.target="_blank"; a.rel="noopener noreferrer";
        row.appendChild(cb); row.appendChild(body); row.appendChild(a);
        cb.addEventListener("change", function(){
          if(cb.checked) zst[v.url]=1; else delete zst[v.url];
          try{ localStorage.setItem("goen-zadankai", JSON.stringify(zst)); }catch(e){}
          paint();
        });
        rows.push({row:row, cb:cb, v:v});
        box.appendChild(row);
      });
      if(z.note){
        var nd = el("details","note");
        nd.appendChild(el("summary",null,z.note.title));
        z.note.text.forEach(function(t){ nd.appendChild(el("p",null,t)); });
        if(z.note.file){
          var ln = el("div","links");
          var o = el("a","ghost",z.note.file.view); o.href=z.note.file.url; o.target="_blank"; o.rel="noopener noreferrer"; ln.appendChild(o);
          var dl = el("a",null,z.note.file.dlLabel); dl.href=z.note.file.dlUrl; dl.target="_blank"; dl.rel="noopener noreferrer"; ln.appendChild(dl);
          nd.appendChild(ln);
        }
        box.appendChild(nd);
      }
      function paint(){
        var all = true;
        rows.forEach(function(r){ var on = !!zst[r.v.url]; r.cb.checked = on; r.row.className = "zv"+(on?" done":""); if(!on) all = false; });
        if(sum){
          sum.textContent = "高森先生座談会（"+z.no+"回目）";
          sum.appendChild(el("span","small","　"+z.videos.map(function(v){ return v.part; }).join("・")));
          if(all) sum.appendChild(el("span","tag","見た"));
          box.className = "za"+(all?" done":"");
        }
      }
      paint();
      zbox.appendChild(box);
    });
    document.getElementById("zaWrap").hidden = false;
    // ボタンを押したときは、格納を開閉せずに遷移だけする
    document.querySelector("#zaWrap .fuse").addEventListener("click", function(e){ e.stopPropagation(); });
  }
})();
</script>
</body>
</html>
